<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Remote Worker Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="card">
    <h1>Remote Chrome Worker</h1>
    <p>Pasang extension ini pada setiap Chrome Profile yang ingin dijadikan worker.</p>

    <label>Apps Script Web App URL</label>
    <input id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec" />

    <label>Device name</label>
    <input id="deviceName" placeholder="Laptop-Ihsan" />

    <label>Profile name</label>
    <input id="profileName" placeholder="Account-1" />

    <label>Device group</label>
    <input id="deviceGroup" placeholder="laptop-ihsan" />

    <label>Worker token</label>
    <input id="workerToken" type="password" placeholder="worker-secret-token" />

    <button id="saveBtn">Simpan</button>
    <div id="status"></div>

    <hr />
    <b>Device ID</b>
    <pre id="deviceId"></pre>
  </main>

  <script type="module" src="options.js"></script>
</body>
</html>
