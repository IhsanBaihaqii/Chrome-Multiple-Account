<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Remote Worker</title>
  <style>
    body { width: 300px; font-family: Arial, sans-serif; padding: 14px; }
    h3 { margin: 0 0 12px; }
    .row { margin: 8px 0; }
    .muted { color: #666; font-size: 12px; word-break: break-all; }
    button { width: 100%; padding: 10px; cursor: pointer; }
    .ok { color: green; }
    .bad { color: #b00020; }
  </style>
</head>
<body>
  <h3>Remote Chrome Worker</h3>
  <div class="row"><b>Device:</b> <span id="device">-</span></div>
  <div class="row"><b>Profile:</b> <span id="profile">-</span></div>
  <div class="row"><b>Last sync:</b> <span id="lastSync">-</span></div>
  <div class="row muted" id="deviceId"></div>
  <button id="syncBtn">Sync sekarang</button>
  <div class="row" id="status"></div>
  <p><a href="../options/options.html" target="_blank">Buka pengaturan</a></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
