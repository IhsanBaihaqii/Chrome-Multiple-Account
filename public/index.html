<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Multi Account Launcher</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h2>Multi Account Launcher</h2>

      <div class="form-group">
        <label>Jumlah akun</label>

        <input type="number" id="jumlah" min="1" placeholder="Contoh: 3" />
      </div>

      <div class="form-group">
        <label>URL tujuan</label>

        <input type="text" id="url" placeholder="https://www.tiktok.com" />
      </div>

      <button id="openBtn">Buka Semua</button>

      <p id="message"></p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
