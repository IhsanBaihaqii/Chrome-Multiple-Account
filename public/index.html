<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chrome Remote Control</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        margin: 0;
        padding: 20px;
        max-width: 640px;
        margin: auto;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 4px;
      }
      h2 {
        font-size: 16px;
        margin-top: 28px;
        color: #93c5fd;
      }
      .sub {
        color: #94a3b8;
        font-size: 13px;
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 13px;
        margin: 10px 0 4px;
        color: #cbd5e1;
      }
      input,
      select,
      button,
      textarea {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #e2e8f0;
        font-size: 15px;
        font-family: inherit;
      }
      button {
        background: #2563eb;
        border: none;
        font-weight: 600;
        margin-top: 14px;
        cursor: pointer;
        padding: 13px;
        transition: 0.15s;
      }
      button:hover {
        background: #1d4ed8;
      }
      button.secondary {
        background: #475569;
      }
      button.danger {
        background: #b91c1c;
      }
      button.small {
        padding: 6px 10px;
        font-size: 12px;
        width: auto;
        margin: 0;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 10px;
        padding: 16px;
        margin-top: 14px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row > * {
        flex: 1;
      }
      .worker-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
        border-radius: 8px;
        background: #0f172a;
        margin-bottom: 6px;
        font-size: 14px;
      }
      .worker-item input[type="checkbox"] {
        width: auto;
        margin-right: 8px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
      }
      .online {
        background: #064e3b;
        color: #6ee7b7;
      }
      .offline {
        background: #7f1d1d;
        color: #fecaca;
      }
      .result {
        margin-top: 14px;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        display: none;
        white-space: pre-wrap;
      }
      .ok {
        background: #064e3b;
        color: #6ee7b7;
        display: block;
      }
      .err {
        background: #7f1d1d;
        color: #fecaca;
        display: block;
      }
      .status-box {
        background: #0f172a;
        padding: 12px;
        border-radius: 8px;
        font-size: 13px;
        color: #94a3b8;
        margin-top: 10px;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h1>🖥️ Chrome Remote Control</h1>
    <div class="sub">Buka URL di banyak laptop sekaligus — tanpa login</div>

    <!-- STATUS PERANGKAT INI -->
    <h2>📊 Status Perangkat Ini</h2>
    <div id="statusBox" class="status-box">Memuat...</div>

    <!-- CONTROL PANEL -->
    <h2>🎮 Kirim Perintah</h2>
    <div class="card">
      <label>Jumlah Akun/Profil Chrome</label>
      <input id="jumlah" type="number" min="1" value="3" />

      <label>URL Tujuan</label>
      <input
        id="url"
        type="text"
        value="https://www.tiktok.com"
        placeholder="https://..."
      />

      <label>Pilih Worker (perangkat tujuan)</label>
      <div id="workerList">Memuat worker...</div>

      <button onclick="sendControl()">🚀 Kirim Perintah</button>
      <div id="result" class="result"></div>
    </div>

    <!-- MANAGE WORKERS -->
    <h2>🔧 Kelola Worker</h2>
    <div class="card">
      <div class="row">
        <input
          id="newWorkerIp"
          type="text"
          placeholder="IP (mis. 192.168.1.10)"
        />
        <input id="newWorkerName" type="text" placeholder="Nama (opsional)" />
      </div>
      <button class="secondary" onclick="addWorker()">
        ➕ Tambah Worker Manual
      </button>
      <button class="secondary" onclick="discover()">🔍 Auto Discover</button>
    </div>

    <script>
      const API = window.location.origin;

      // ================================
      // STATUS
      // ================================
      async function loadStatus() {
        try {
          const res = await fetch(`${API}/status`);
          const data = await res.json();
          document.getElementById("statusBox").innerHTML =
            `Device : ${data.device}\n` +
            `Mode   : ${data.mode}\n` +
            `Chrome : ${data.chrome}\n` +
            `Worker : ${data.workersCount} terdaftar\n` +
            `IP     : ${data.ips.join(", ")}`;
        } catch (e) {
          document.getElementById("statusBox").textContent =
            "Gagal memuat status.";
        }
      }

      // ================================
      // WORKERS
      // ================================
      let workers = [];

      async function loadWorkers() {
        const res = await fetch(`${API}/workers`);
        const data = await res.json();
        workers = data.workers || [];
        renderWorkers();
      }

      function renderWorkers() {
        const container = document.getElementById("workerList");
        if (workers.length === 0) {
          container.innerHTML =
            '<div style="color:#94a3b8;font-size:13px;">Belum ada worker. Tambahkan manual atau klik Auto Discover.</div>';
          return;
        }
        container.innerHTML = "";
        workers.forEach((w) => {
          const div = document.createElement("div");
          div.className = "worker-item";
          div.innerHTML = `
      <label style="display:flex;align-items:center;cursor:pointer;margin:0;">
        <input type="checkbox" value="${w.ip}" data-name="${w.name}" checked />
        <span>
          <strong>${w.name}</strong> — ${w.ip}
          <span class="badge ${w.status === "online" ? "online" : "offline"}">${w.status}</span>
        </span>
      </label>
      <button class="danger small" onclick="removeWorker('${w.id}')">Hapus</button>
    `;
          container.appendChild(div);
        });
      }

      // ================================
      // CONTROL
      // ================================
      async function sendControl() {
        const jumlah = parseInt(document.getElementById("jumlah").value);
        const url = document.getElementById("url").value.trim();
        const result = document.getElementById("result");

        const checked = [
          ...document.querySelectorAll(
            '#workerList input[type="checkbox"]:checked',
          ),
        ];
        const selected = checked.map((cb) => ({
          ip: cb.value,
          name: cb.dataset.name,
        }));

        if (!jumlah || !url || selected.length === 0) {
          result.className = "result err";
          result.textContent = "Isi jumlah, URL, dan pilih minimal 1 worker!";
          return;
        }

        result.className = "result";
        result.textContent = "Mengirim perintah...";

        try {
          const res = await fetch(`${API}/control`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ jumlah, url, workers: selected }),
          });
          const data = await res.json();

          let text = `✅ Berhasil: ${data.success_count} worker\n`;
          if (data.error_count > 0)
            text += `❌ Gagal   : ${data.error_count} worker\n`;
          text += "\n";
          data.results.forEach(
            (r) => (text += `✔ ${r.worker} (${r.ip}): ${r.message}\n`),
          );
          data.errors.forEach(
            (e) => (text += `✖ ${e.worker} (${e.ip}): ${e.message}\n`),
          );

          result.className = "result ok";
          result.textContent = text;
          loadWorkers();
        } catch (e) {
          result.className = "result err";
          result.textContent = "Error: " + e.message;
        }
      }

      // ================================
      // MANAGE WORKERS
      // ================================
      async function addWorker() {
        const ip = document.getElementById("newWorkerIp").value.trim();
        const name = document.getElementById("newWorkerName").value.trim();
        if (!ip) return alert("IP wajib diisi!");

        const res = await fetch(`${API}/add-worker`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ip, name }),
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("newWorkerIp").value = "";
          document.getElementById("newWorkerName").value = "";
          loadWorkers();
        } else {
          alert(data.message);
        }
      }

      async function removeWorker(id) {
        if (!confirm("Hapus worker ini?")) return;
        await fetch(`${API}/remove-worker`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        });
        loadWorkers();
      }

      async function discover() {
        const btn = event.target;
        btn.disabled = true;
        btn.textContent = "🔍 Mencari...";
        try {
          await fetch(`${API}/discover`, { method: "POST" });
          loadWorkers();
        } finally {
          btn.disabled = false;
          btn.textContent = "🔍 Auto Discover";
        }
      }

      // ================================
      // INIT
      // ================================
      loadStatus();
      loadWorkers();
      setInterval(loadStatus, 10000);
    </script>
  </body>
</html>
