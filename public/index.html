<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Multi Account Launcher</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-container">
      <div class="login-box">
        <div class="login-header">
          <h1>🔐 Multi Account Launcher</h1>
          <p>Silakan login untuk mengontrol perangkat</p>
          <div class="device-mode-info">
            <span class="mode-badge worker">⚙️ Mode: Worker</span>
            <small style="display: block; margin-top: 5px; color: #999">
              Login untuk menjadi Controller
            </small>
          </div>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              placeholder="Masukkan username"
              value="admin"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Masukkan password"
              value="admin123"
              required
            />
          </div>

          <button type="submit" id="loginBtn">Login</button>

          <div id="loginMessage" class="login-message"></div>
        </form>

        <div class="login-footer">
          <small>Default: admin / admin123</small>
          <br />
          <small style="color: #999"
            >💡 Login = Controller | Logout = Worker</small
          >
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
